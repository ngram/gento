plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - "vendor/**/*"
    - "web/vendor/**/*"
    - "worker/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
    - "web/app.rb"

Metrics/MethodLength:
  Max: 20

# Keyword arguments are self-documenting at the call site; a long list of them
# is not the readability problem this cop is aimed at.
Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/ClassLength:
  Max: 130

Layout/LineLength:
  Max: 110

RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Max: 5
